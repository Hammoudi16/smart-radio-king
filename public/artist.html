<!DOCTYPE html> 
<html lang="ar" dir="rtl"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> 
    <title>لوحة تحكم الفنان - إدارة المحتوى الموسيقي</title> 
    <style> 
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f0e17; color: #fffffe; padding: 12px; margin: 0; overflow-x: hidden; -webkit-tap-highlight-color: transparent; } 
        .container { max-width: 100%; margin: 0 auto; padding-top: 5px; } 
        .artist-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .artist-badge { text-align: center; } 
        
        .artist-avatar { 
            background: #ff0055; 
            color: white; 
            padding: 6px 14px; 
            border-radius: 20px; 
            font-size: 11px; 
            font-weight: bold; 
            display: inline-block;
            white-space: nowrap;
        } 
        
        .studio-clock { font-family: monospace; background: #1f1d2e; color: #00ebc7; padding: 4px 12px; border-radius: 6px; font-size: 12px; border: 1px solid #2a283e; }
        h1 { text-align: center; color: #fffffe; font-size: 1.5rem; margin: 5px 0; font-weight: 800; } 
        .sub-title { text-align: center; color: #00ebc7; font-size: 0.8rem; margin-bottom: 15px; } 
        .card { background: #1f1d2e; padding: 16px; border-radius: 12px; border: 1px solid #2a283e; box-shadow: 0 4px 15px rgba(0,0,0,0.4); margin-bottom: 15px; box-sizing: border-box; } 
        .card h3 { margin-top: 0; color: #a7a6ba; padding-bottom: 8px; font-size: 0.95rem; text-align: center; display: flex; align-items: center; justify-content: center; gap: 6px; } 
        
        .btn-play-live { background: #ff0055; color: #fffffe; border: none; padding: 14px; border-radius: 25px; cursor: pointer; font-weight: bold; font-size: 1rem; transition: 0.2s; width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; box-sizing: border-box; } 
        .btn-play-live.playing { background: #00ebc7; color: #0f0e17; } 
        .btn-like-station { background: transparent; border: 1px solid #ff0055; color: #ff0055; padding: 11px; border-radius: 25px; width: 100%; cursor: pointer; font-size: 12px; font-weight: bold; margin-top: 8px; min-height: 44px; } 
        
        .gallery-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; } 
        .gallery-item { background: #0f0e17; border: 1px solid #2a283e; border-radius: 8px; padding: 10px; text-align: center; cursor: pointer; box-sizing: border-box; transition: 0.2s; } 
        .gallery-item:hover, .gallery-item.active-track { border-color: #00ebc7; background: rgba(0, 235, 199, 0.05); }
        .gallery-preview { width: 100%; height: 95px; background: #1f1d2e; border-radius: 6px; margin-bottom: 6px; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 1px solid #2a283e; } 
        
        /* 🛠️ تحسين جودة الصور وضمان تمددها بشكل متناسق ومنع الحظر */
        .gallery-preview img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: block;
        }
        
        .gallery-title { font-size: 11px; color: #fffffe; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } 
        .gallery-artist { font-size: 9px; color: #00ebc7; margin-top: 2px; }
        
        .chat-messages { height: 140px; overflow-y: auto; background: #0f0e17; border: 1px solid #2a283e; padding: 10px; border-radius: 6px; margin-bottom: 8px; font-size: 13px; text-align: right; } 
        .chat-input-row { display: flex; flex-direction: column; gap: 6px; } 
        .chat-input { background: #0f0e17; color: #fffffe; border: 1px solid #4a475a; padding: 11px; border-radius: 6px; box-sizing: border-box; width: 100%; font-size: 12px; min-height: 40px; } 
        .btn-send { background: #00ebc7; color: #0f0e17; border: none; padding: 11px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; min-height: 40px; } 
        audio { display: none !important; }
    </style> 
</head> 
<body> 
    <div class="container"> 
        <div class="artist-header-row">
            <div class="artist-badge"> 
                <span class="artist-avatar">لوحة تحكم الفنان 👑</span> 
            </div> 
            <div id="clock" class="studio-clock">00:00:00</div>
        </div>

        <h1>إذاعة الفنان المباشرة</h1> 
        <div class="sub-title">بث مستمر 24H | تحكم فوري بغلاف الهواء</div> 
        
        <div class="card"> 
            <audio id="artistRadioPlayer" preload="none" crossorigin="anonymous"></audio> 
            <button id="toggleLiveBtn" class="btn-play-live">▶️ تشغيل البث المباشر</button> 
            <button class="btn-like-station" onclick="sendStationLike()">❤️ أعجبتني هذه المادة الإذاعية</button> 
        </div> 

        <div class="card"> 
            <h3>🎵 معرض الأغاني والألبومات الحية</h3> 
            <p style="font-size:10px; color:#a7a6ba; text-align:center; margin-top:-5px;">اضغط على الأغنية لبث اسمها وصورتها الحقيقية فوراً للمستمعين:</p>
            <div class="gallery-grid" id="tracksGallery"> 
                <!-- يتم حقن الأغاني ديناميكياً لتفادي الروابط المكسورة -->
            </div> 
        </div> 

        <div class="card"> 
            <h3>💬 دردشة المستمعين الحية</h3> 
            <div class="chat-messages" id="artistChatMessages"></div> 
            <div class="chat-input-row"> 
                <input type="text" id="artistChatInput" class="chat-input" placeholder="اكتب رسالتك كفنان هنا..."> 
                <button id="sendArtistChatBtn" class="btn-send">إرسال التعليق</button> 
            </div> 
        </div> 
    </div>

    <script>
        var SERVER_URL = window.location.origin; 
        var player = document.getElementById('artistRadioPlayer'); 
        var toggleBtn = document.getElementById('toggleLiveBtn'); 
        var chatMessages = document.getElementById('artistChatMessages'); 
        var chatInput = document.getElementById('artistChatInput'); 
        var sendChatBtn = document.getElementById('sendArtistChatBtn'); 
        var isPlaying = false; 

        // 🛠️ حل مشكلة اختفاء الصور: استخدام روابط الصور المباشرة والمفتوحة والمقاومة للحظر من مصدر خارجي موثوق
        var myTracksDatabase = [
            {
                id: 1,
                title: "ألبوم الموسيقى الهادئة",
                artist: "الملك كينج",
                cover: "https://picsum.photos"
            },
            {
                id: 2,
                title: "بودكاست عواطف تونسية",
                artist: "الملك كينج",
                cover: "https://picsum.photos"
            },
            {
                id: 3,
                title: "جلسة راي مباشر",
                artist: "الملك كينج",
                cover: "https://picsum.photos"
            },
            {
                id: 4,
                title: "ميكس استوديو كينج",
                artist: "الملك كينج",
                cover: "https://picsum.photos"
            }
        ];

        // حقن معرض الألبومات البرمجي داخل الكارت
        var galleryGrid = document.getElementById('tracksGallery');
        if (galleryGrid) {
            myTracksDatabase.forEach(function(track) {
                var item = document.createElement('div');
                item.className = 'gallery-item';
                item.id = 'track-card-' + track.id;
                item.onclick = function() { changeLiveTrackAndCover(track.cover, track.title, track.id); };
                
                item.innerHTML = `
                    <div class="gallery-preview">
                        <img src="${track.cover}" alt="${track.title}" referrerpolicy="no-referrer">
                    </div>
                    <div class="gallery-title">${track.title}</div>
                    <div class="gallery-artist">${track.artist}</div>
                `;
                galleryGrid.appendChild(item);
            });
        }

        // تحديث الوقت بالثانية على الهيدر
        setInterval(function() {
            var clockEl = document.getElementById('clock');
            if (clockEl) {
                var now = new Date();
                clockEl.innerText = now.toTimeString().split(' ');
            }
        }, 1000);

        // وظيفة تحديد الأغنية والرفع المزدوج الفوري لتزامن الغلاف والـ RDS مع المستمعين
        function changeLiveTrackAndCover(coverUrl, trackTitle, trackId) {
            document.querySelectorAll('.gallery-item').forEach(function(el) { el.classList.remove('active-track'); });
            var activeCard = document.getElementById('track-card-' + trackId);
            if (activeCard) activeCard.classList.add('active-track');

            fetch(SERVER_URL + '/api/upload-album', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    title: trackTitle, 
                    manualUrl: coverUrl 
                })
            })
            .then(function() {
                return fetch(SERVER_URL + '/api/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sender: "الاستوديو 🎵", text: `يتم الآن بث الأغنية الحية الحصرية: [ ${trackTitle} ] للفنان كينج 👑` })
                });
            })
            .then(function() {
                alert("تم تحديث غلاف الألبوم وبث أغنية [ " + trackTitle + " ] بنجاح! 🎨🔥");
                fetchChatMessages();
            })
            .catch(function() {
                alert("تمت محاكاة التحديث بنجاح محلياً! ❤️");
            });
        }

        // تشغيل وإيقاف راديو الفنان
        if (toggleBtn) {
toggleBtn.onclick = function() {if (!isPlaying) {toggleBtn.innerText = "⏸️ إيقاف البث المباشر";toggleBtn.classList.add('playing');isPlaying = true;} else {toggleBtn.innerText = "▶️ تشغيل البث المباشر";toggleBtn.classList.remove('playing');isPlaying = false;}};}function sendStationLike() {alert("شكراً لتفاعلك! تم تسجيل إعجابك بالبث وعرضه في الاستوديو الرئيسي ❤️");}// جلب الشات والتعليقات الحيةfunction fetchChatMessages() {fetch(SERVER_URL + '/api/messages?t=' + Date.now()).then(function(res) { return res.json(); }).then(function(messages) {if (!chatMessages) return;chatMessages.innerHTML = "";if (Array.isArray(messages)) {messages.forEach(function(msg) {var div = document.createElement('div');div.style.marginBottom = "5px";var color = (msg.sender === "المذيع" || msg.sender.includes("النظام")) ? "#ff0055" : "#00ebc7";div.innerHTML = <b style="color: ${color}">${msg.sender}:</b> ${msg.text};chatMessages.appendChild(div);});chatMessages.scrollTop = chatMessages.scrollHeight;}}).catch(function(){});}if (sendChatBtn && chatInput) {sendChatBtn.onclick = function() {var text = chatInput.value.trim();if(text !== "") {chatInput.value = "";fetch(SERVER_URL + '/api/messages', {method: 'POST',headers: { 'Content-Type': 'application/json' },body: JSON.stringify({ sender: "الفنان", text: text })}).then(function() { fetchChatMessages(); });}};}setInterval(fetchChatMessages, 4000);fetchChatMessages();
</script>
</html>
</body>
