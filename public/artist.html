<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الفنان - إدارة المحتوى الموسيقي</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f0e17; color: #fffffe; padding: 20px; margin: 0; }
        .container { max-width: 700px; margin: 0 auto; padding-top: 20px; }
        h1 { text-align: center; color: #00ebc7; font-size: 2rem; margin-bottom: 5px; text-shadow: 0 0 10px rgba(0, 235, 199, 0.3); }
        .sub-title { text-align: center; color: #a7a6ba; font-size: 0.9rem; margin-bottom: 25px; }
        .card { background: #1f1d2e; padding: 25px; border-radius: 12px; border: 1px solid #2a283e; box-shadow: 0 4px 20px rgba(0,0,0,0.4); margin-bottom: 20px; }
        .card h3 { margin-top: 0; color: #00ebc7; border-bottom: 2px solid #2a283e; padding-bottom: 10px; font-size: 1.2rem; text-align: right; }
        .form-group { margin-bottom: 15px; text-align: right; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 14px; color: #a7a6ba; }
        .form-control { width: 100%; background: #0f0e17; color: #fffffe; border: 1px solid #4a475a; padding: 12px; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .form-control:focus { border-color: #00ebc7; outline: none; }
        .btn-submit { background: #00ebc7; color: #0f0e17; border: none; padding: 14px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1.1rem; transition: 0.3s; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-submit:hover { background: #33f0d2; transform: scale(1.01); }
        .track-list { list-style: none; padding: 0; margin: 0; text-align: right; }
        .track-item { display: flex; justify-content: space-between; align-items: center; background: #0f0e17; padding: 12px; border-radius: 6px; margin-bottom: 8px; border: 1px solid #2a283e; }
        .track-info { font-size: 14px; }
        .track-stats { font-size: 12px; color: #ff0055; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>👨‍🎤 لوحة تحكم الفنان</h1>
        <div class="sub-title">إدارة الأغاني، رفع التراكات ومتابعة الإعجابات الحية من المستمعين</div>

        <div class="card">
            <h3>📤 رفع تراك أو عمل فني جديد</h3>
            <form id="uploadTrackForm">
                <div class="form-group">
                    <label for="trackTitle">اسم الأغنية / التراك:</label>
                    <input type="text" id="trackTitle" class="form-control" placeholder="أدخل اسم العمل الفني..." required>
                </div>
                <div class="form-group">
                    <label for="trackFile">اختر الملف الصوتي (MP3):</label>
                    <input type="file" id="trackFile" class="form-control" accept="audio/mp3, audio/*" required>
                </div>
                <button type="submit" class="btn-submit">تثبيت ورفع العمل الفني للسيرفر 🚀</button>
            </form>
        </div>

        <div class="card">
            <h3>📊 أعمالي الفنية المرفوعة وإحصائياتها</h3>
            <ul class="track-list" id="artistTrackList">
                <li style="color: #a7a6ba; text-align: center; padding: 15px;">جاري تحميل قائمة التراكات...</li>
            </ul>
        </div>
    </div>

    <script>
        var SERVER_URL = window.location.origin;
        var uploadForm = document.getElementById('uploadTrackForm');
        var trackList = document.getElementById('artistTrackList');

        function loadArtistTracks() {
            fetch(SERVER_URL + '/api/artist-tracks')
            .then(function(res) { return res.json(); })
            .then(function(tracks) {
                if (!trackList) return;
                trackList.innerHTML = "";
                if (!Array.isArray(tracks) || tracks.length === 0) {
                    trackList.innerHTML = `<li style="color: #a7a6ba; text-align: center; padding: 15px;">لم تقم برفع أي أعمال فنية بعد.</li>`;
                    return;
                }
                tracks.forEach(function(track) {
                    var li = document.createElement('li');
                    li.className = "track-item";
                    var likesCount = track.likes !== undefined ? track.likes : 0;
                    li.innerHTML = `
                        <div class="track-info"><span>🎵 ${document.createTextNode(track.title).textContent}</span></div>
                        <div class="track-stats"><span>❤️ ${likesCount} تفاعل</span></div>
                    `;
                    trackList.appendChild(li);
                });
            })
            .catch(function() {
                trackList.innerHTML = `<li style="color: #ff0055; text-align: center; padding: 15px;">فشل تحديث البيانات الفنية.</li>`;
            });
        }

        if (uploadForm) {
            uploadForm.onsubmit = function(e) {
                e.preventDefault();
                var titleInput = document.getElementById('trackTitle');
                var fileInput = document.getElementById('trackFile');
                
                if (!fileInput.files || fileInput.files.length === 0) {
                    alert("الرجاء اختيار ملف صوتی أولاً!");
                    return false;
                }

                var formData = new FormData();
                formData.append("title", titleInput.value.trim());
                // تصحيح الخطأ البرمجي هنا: إرسال الملف الأول المباشر من مصفوفة الإدخال ليتعرف عليه الـ Multer بالسيرفر
                formData.append("audioTrack", fileInput.files[0]); 

                fetch(SERVER_URL + '/api/upload-artist-track', {
                    method: 'POST',
                    body: formData
                })
                .then(function(res) {
                    if(!res.ok) throw new Error("رفع غير صالح");
                    return res.json();
                })
                .then(function() {
                    alert("تم رفع العمل الفني بنجاح!");
                    titleInput.value = "";
                    fileInput.value = "";
                    loadArtistTracks();
                })
                .catch(function() {
                    alert("حدث خطأ أثناء رفع الملف للسيرفر.");
                });
                return false;
            };
        }

        setInterval(loadArtistTracks, 4000);
        loadArtistTracks();
    </script>
</body>
</html>
