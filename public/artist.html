<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الفنان - إدارة المحتوى الموسيقي</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f0e17; color: #fffffe; padding: 20px; margin: 0; overflow-x: hidden; }
        .container { max-width: 600px; margin: 0 auto; padding-top: 20px; }
        .artist-badge { text-align: center; margin-bottom: 15px; }
        .artist-avatar { background: #ff0055; color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        h1 { text-align: center; color: #fffffe; font-size: 1.8rem; margin: 10px 0 5px 0; }
        .sub-title { text-align: center; color: #00ebc7; font-size: 0.9rem; margin-bottom: 20px; }
        .card { background: #1f1d2e; padding: 25px; border-radius: 12px; border: 1px solid #2a283e; box-shadow: 0 4px 20px rgba(0,0,0,0.4); margin-bottom: 20px; }
        .card h3 { margin-top: 0; color: #a7a6ba; padding-bottom: 10px; font-size: 1.1rem; text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px; }
        
        /* أزرار التحكم بالبث المباشر المتوافقة مع صورتك */
        .btn-play-live { background: #ff0055; color: #fffffe; border: none; padding: 14px; border-radius: 25px; cursor: pointer; font-weight: bold; font-size: 1.1rem; transition: 0.3s; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px; }
        .btn-play-live.playing { background: #00ebc7; color: #0f0e17; }
        .btn-like-station { background: transparent; border: 1px solid #ff0055; color: #ff0055; padding: 10px; border-radius: 25px; width: 100%; cursor: pointer; font-size: 13px; font-weight: bold; transition: 0.3s; }
        .btn-like-station:hover { background: rgba(255, 0, 85, 0.1); }

        /* معرض الألبومات والبودكاست */
        .gallery-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 10px; }
        .gallery-item { background: #0f0e17; border: 1px solid #2a283e; border-radius: 8px; padding: 15px; text-align: center; }
        .gallery-preview { width: 100%; height: 90px; background: #1f1d2e; border-radius: 6px; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; border: 1px dashed #4a475a; color: #4a475a; font-size: 24px; }
        .gallery-title { font-size: 12px; color: #a7a6ba; }

        /* صندوق دردشة المستمعين الحية */
        .chat-messages { height: 180px; overflow-y: auto; background: #0f0e17; border: 1px solid #2a283e; padding: 12px; border-radius: 6px; margin-bottom: 10px; font-size: 14px; text-align: right; }
        .chat-input-row { display: flex; gap: 8px; }
        .chat-input { background: #0f0e17; color: #fffffe; border: 1px solid #4a475a; padding: 12px; border-radius: 6px; box-sizing: border-box; flex: 1; font-size: 13px; }
        .btn-send { background: #00ebc7; color: #0f0e17; border: none; padding: 0 20px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; }
    </style>
</head>
<body>
    <div class="container">
        
        <div class="artist-badge">
            <span class="artist-avatar">Artist Avatar</span>
        </div>
        <h1>إذاعة الفنان المباشرة</h1>
        <div class="sub-title">بث مستمر 24H | مستعد لتلقي استماعكم</div>

        <!-- كارد مشغل البث المباشر المطور -->
        <div class="card">
            <audio id="artistRadioPlayer" preload="none"></audio>
            <button id="toggleLiveBtn" class="btn-play-live">▶️ تشغيل البث المباشر</button>
            <button class="btn-like-station" onclick="sendStationLike()">❤️ أعجبتني هذه المادة الإذاعية</button>
        </div>

        <!-- معرض الألبومات والبودكاست المحدث -->
        <div class="card">
            <h3>🎵 معرض الألبومات وبودكاست المحطة</h3>
            <div class="gallery-grid" id="tracksGallery">
                <div class="gallery-item">
                    <div class="gallery-preview">🎵</div>
                    <div class="gallery-title">ألبوم الموسيقى الهادئة</div>
                </div>
                <div class="gallery-item">
                    <div class="gallery-preview">🎙️</div>
                    <div class="gallery-title">بودكاست عواطف تونسية</div>
                </div>
            </div>
        </div>

        <!-- صندوق دردشة المستمعين الحية -->
        <div class="card">
            <h3>💬 دردشة المستمعين الحية</h3>
            <div class="chat-messages" id="artistChatMessages"></div>
            <div class="chat-input-row">
                <input type="text" id="artistChatInput" class="chat-input" placeholder="اكتب رسالتك هنا...">
                <button id="sendArtistChatBtn" class="btn-send">إرسال</button>
            </div>
        </div>

    </div>

    <script>
        var SERVER_URL = window.location.origin;
        var player = document.getElementById('artistRadioPlayer');
        var toggleBtn = document.getElementById('toggleLiveBtn');
        var chatMessages = document.getElementById('artistChatMessages');
        var chatInput = document.getElementById('artistChatInput');
        var sendChatBtn = document.getElementById('sendArtistChatBtn');
        var isPlaying = false;

        // 📌 دالة التحكم بالتشغيل والإيقاف وإجبار المتصفح على البث وتفادي الكاش
        // دالة التحكم بالتشغيل والإيقاف وتفادي الكاش الميت في لوحة الفنان
if (toggleBtn && player) {
    toggleBtn.onclick = function() {
        if (!isPlaying) {
            // 👇 هنا نضع الكود الجديد داخل لوحة الفنان 👇
            player.src = window.location.origin + "/radio.mp3?t=" + Date.now();
            player.load();
            player.play()
            .then(function() {
                isPlaying = true;
                toggleBtn.innerText = "⏸️ إيقاف مؤقت";
                toggleBtn.classList.add('playing');
            })
            .catch(function(err) {
                alert("فشل تشغيل الصوت، تأكد من رفع ملف jingle1.mp3 حقيقي في السيرفر.");
                console.log(err);
            });
        } else {
            player.pause();
            player.src = "";
            isPlaying = false;
            toggleBtn.innerText = "▶️ تشغيل البث المباشر";
            toggleBtn.classList.remove('playing');
        }
    };
}


        // دالة جلب الشات وتحديثه برمجياً مع حماية كاملة ضد الاختراق XSS
        function fetchChatAndTracks() {
            fetch(SERVER_URL + '/api/messages?t=' + Date.now())
            .then(function(res) { return res.json(); })
            .then(function(messages) {
                if (!chatMessages) return;
                chatMessages.innerHTML = "";
                if (Array.isArray(messages)) {
                    messages.forEach(function(msg) {
                        var div = document.createElement('div');
                        div.style.marginBottom = "8px";
                        var color = msg.sender === "المذيع" ? "#ff0055" : "#00ebc7";
                        
                        var senderB = document.createElement('b');
                        senderB.style.color = color;
                        senderB.innerText = msg.sender + ": ";
                        
                        var textNode = document.createTextNode(msg.text);
                        
                        div.appendChild(senderB);
                        div.appendChild(textNode);
                        chatMessages.appendChild(div);
                    });
                }
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }).catch(function(){});
        }

        // إرسال رد أو تعليق من لوحة الفنان
        if (sendChatBtn) {
            sendChatBtn.onclick = function(e) {
                if (e) e.preventDefault();
                var text = chatInput.value.trim();
                if (!text) return false;
                chatInput.value = "";

                fetch(SERVER_URL + '/api/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sender: "الفنان", text: text })
                })
                .then(function() { fetchChatAndTracks(); })
                .catch(function(){});
                return false;
            };
        }

        function sendStationLike() {
            alert("شكراً لتفاعلك! تم تسجيل إعجابك بالمادة الإذاعية الحالية ❤️");
        }

        // التحديث الدوري التلقائي كل 3 ثوانٍ
        setInterval(fetchChatAndTracks, 3000);
        fetchChatAndTracks();
    </script>
</body>
</html>
