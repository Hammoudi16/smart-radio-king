<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>استوديو راديو كينج الذكي - لوحة المذيع</title>
    <!-- جلب مكتبة الرسوم البيانية العالمية Chart.js عبر رابط آمن ومجرب 100% -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f0e17; color: #fffffe; padding: 12px; margin: 0; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { text-align: center; color: #ff0055; font-size: 1.6rem; margin: 10px 0 20px 0; text-shadow: 0 0 10px rgba(255, 0, 85, 0.3); font-weight: 800; }
        .grid-layout { display: flex; flex-direction: column; gap: 15px; }
        .card { background: #1f1d2e; padding: 16px; border-radius: 12px; border: 1px solid #2a283e; box-shadow: 0 4px 15px rgba(0,0,0,0.4); box-sizing: border-box; }
        .card h3 { margin-top: 0; color: #ff0055; border-bottom: 2px solid #2a283e; padding-bottom: 8px; font-size: 1rem; text-align: right; display: flex; align-items: center; gap: 6px; }
        
        button { background: #ff0055; color: #fffffe; border: none; padding: 14px 10px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; width: 100%; margin: 6px 0; font-size: 13px; display: flex; align-items: center; justify-content: center; min-height: 48px; box-sizing: border-box; }
        button:disabled { background: #4a475a !important; cursor: not-allowed; color: #a7a6ba; }
        
        .status { color: #00ebc7; font-weight: bold; }
        input { background: #0f0e17; color: #fffffe; border: 1px solid #4a475a; padding: 12px; border-radius: 8px; margin: 6px 0; width: 100%; box-sizing: border-box; font-size: 13px; min-height: 44px; }
        input[type="range"] { accent-color: #ff0055; background: #2a283e; height: 8px; border-radius: 4px; padding: 0; min-height: auto; }
        
        .chat-messages { height: 140px; overflow-y: auto; background: #0f0e17; border: 1px solid #2a283e; padding: 10px; border-radius: 6px; margin-bottom: 8px; font-size: 13px; text-align: right; }
        .chat-input-row { display: flex; flex-direction: column; gap: 6px; }
        .vu-meter-container { width: 100%; height: 12px; background: #0f0e17; border-radius: 4px; border: 1px solid #2a283e; overflow: hidden; margin-top: 8px; }
        .vu-meter-bar { height: 100%; width: 0%; background: linear-gradient(to left, #00ebc7, #ffcc00, #ff0055); transition: width 0.1s ease; }
        
        /* تصميم منسق للبادجات والأوسمة الإذاعية في الشات */
        .badge-admin { background: #ff0055; color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; margin-left: 4px; }
        .badge-artist { background: #ffcc00; color: #0f0e17; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; margin-left: 4px; }
        .badge-listener { background: #00ebc7; color: #0f0e17; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; margin-left: 4px; }
    </style>
</head>
<body>

    <div class="container" id="studioMainContent">
        <h1>🎙️ استوديو راديو كينج الذكي</h1>

        <div class="grid-layout">
            <!-- بطاقة المؤشرات والرسوم البيانية المحدثة -->
            <div class="card">
                <h3>📊 مؤشرات الاستوديو وقناة الـ FM الحية</h3>
                <p>حالة البث الحالية: <span id="currentStatus" class="status">إستعداد</span></p>
                <p>المستمعون الآن عبر الإنترنت: <span id="liveListeners" class="status" style="color:#ff0055;">0</span> مستمع</p>
                <p>تردد الإرسال التماثلي: <span class="status" style="color:#00ebc7;">99.5 MHz FM</span></p>
                
                <!-- 📊 الميزة الأولى: حاوية الرسم البياني الذكي للمستمعين -->
                <div style="width: 100%; margin-top: 12px; background: #0f0e17; padding: 10px; border-radius: 8px; border: 1px solid #2a283e; box-sizing: border-box;">
                    <canvas id="audienceChart" style="width: 100% !important; height: 140px !important;"></canvas>
                </div>
                
                <audio id="radioPlayer" style="display:none !important;"></audio>
                <br>
                <label style="font-size: 12px; color: #a7a6ba;">🔊 مستوى صوت الألبومات المجدولة:</label>
                <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="1">
            </div>

            <!-- بطاقة المايكروفون والعداد البصري -->
            <div class="card">
                <h3>🎤 التحكم في الميكروفون والبث المباشر</h3>
                <button id="startMicBtn">🔴 تشغيل الميكروفون وبث مباشر الآن</button>
                <button id="stopMicBtn" disabled style="background: #4a475a;">إيقاف البث والتحويل التلقائي</button>
                
                <label style="font-size: 12px; color: #a7a6ba; margin-top: 5px; display: block;">🎚️ مؤشر جهارة الصوت الحي (VU):</label>
                <div class="vu-meter-container">
                    <div id="vuMeterBar" class="vu-meter-bar"></div>
                </div>
            </div>

            <!-- بطاقة صندوق الدردشة الموحد المطور بالأوسمة -->
            <div class="card">
                <h3>💬 دردشة المستمعين (الاستوديو)</h3>
                <div class="chat-messages" id="studioChatMessages"></div>
                <div class="chat-input-row">
                    <input type="text" id="studioChatInput" placeholder="اكتب رد المذيع هنا...">
                    <button id="sendStudioChatBtn" style="margin: 0; background: #00ebc7; color: #0f0e17;">إرسال الرد للهواء</button>
                </div>
            </div>
        </div>
    </div>

<script>
    var SERVER_URL = window.location.origin;
    var studioChatMessages = document.getElementById('studioChatMessages');
    var studioChatInput = document.getElementById('studioChatInput');
    var sendStudioChatBtn = document.getElementById('sendStudioChatBtn');
    var liveListenersEl = document.getElementById('liveListeners');
    var vuMeterBar = document.getElementById('vuMeterBar');
    
    var isMicStreaming = false;
    var previousListenerCount = 0;

    // 📊 تهيئة ميزة الرسم البياني الإحصائي (Chart.js)
    var ctx = document.getElementById('audienceChart').getContext('2d');
    var audienceData =;
    var timeLabels = ["البدء"];
    
    var audienceChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: timeLabels,
            datasets: [{
                data: audienceData,
                borderColor: '#00ebc7',
                backgroundColor: 'rgba(0, 235, 199, 0.05)',
                borderWidth: 2,
                tension: 0.4,
                pointBackgroundColor: '#ff0055',
                pointRadius: 3
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: { grid: { color: '#2a283e' }, ticks: { color: '#a7a6ba', font: { size: 9 } } },
                y: { grid: { color: '#2a283e' }, ticks: { color: '#a7a6ba', font: { size: 9 } }, beginAtZero: true }
            }
        }
    });

    function updateChartData(newCount) {
        var now = new Date();
        var timeStr = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        
        timeLabels.push(timeStr);
        audienceData.push(newCount);
        
        if (timeLabels.length > 8) {
            timeLabels.shift();
            audienceData.shift();
        }
        audienceChart.update();
    }

    // محاكاة لحركة مؤشر VU Meter البصري عند تفعيل البث
    function simulateVuMeter() {
        if (isMicStreaming && vuMeterBar) {
            var level = Math.floor(Math.random() * 65) + 30;
            vuMeterBar.style.width = level + "%";
        }
    }
    setInterval(simulateVuMeter, 140);

    // جلب وتحديث البيانات والشات بالأوسمة المميزة
    function fetchChatAndStats() {
        fetch('/api/messages?t=' + Date.now())
        .then(function(res) { return res.json(); })
        .then(function(messages) {
            if (!studioChatMessages) return;
            studioChatMessages.innerHTML = "";
            if (Array.isArray(messages)) {
                messages.forEach(function(msg) {
                    var div = document.createElement('div');
                    div.style.marginBottom = "6px";
                    
                    // 👑 الميزة الثانية: تصنيف وحقن الشارات (Badges) بناءً على مرسل الرسالة لمنع التزوير
                    var badgeHTML = `<span class="badge-listener">مستمع</span>`;
                    if (msg.sender === "المذيع") {
                        badgeHTML = `<span class="badge-admin">🎙️ المذيع</span>`;
                    } else if (msg.sender === "الفنان") {
                        badgeHTML = `<span class="badge-artist">👑 الفنان كينج</span>`;
                    } else if (msg.sender.includes("النظام")) {
                        badgeHTML = `<span class="badge-admin">🤖 النظام</span>`;
                    }
                    
                    div.innerHTML = `${badgeHTML} <b>${msg.sender}:</b> <span>${msg.text}</span>`;
                    studioChatMessages.appendChild(div);
                });
                studioChatMessages.scrollTop = studioChatMessages.scrollHeight;
            }
        }).catch(function(err){});

        // جلب الإحصائيات الحية وتحديث المنحنى البياني وصوت التنبيه
        fetch('/api/listeners-count?t=' + Date.now())
        .then(function(res) { return res.json(); })
        .then(function(data) {
            if (data.count !== undefined) {
                liveListenersEl.innerText = data.count;
                updateChartData(data.count);
                


// 🔊 الميزة الرابعة: تشغيل تنبيه صوتي في الاستوديو في حال دخول مستمع جديد
if (data.count > previousListenerCount && previousListenerCount !== 0) {
var audioAlert = new Audio('mixkit.co');
audioAlert.volume = 0.4;
audioAlert.play().catch(function(){});
}
previousListenerCount = data.count;
}
}).catch(function(){});
}

// تفعيل أحداث أزرار الميكروفون
var startMicBtn = document.getElementById('startMicBtn');
var stopMicBtn = document.getElementById('stopMicBtn');
if (startMicBtn && stopMicBtn) {
startMicBtn.onclick = function() {
isMicStreaming = true;
document.getElementById('currentStatus').innerText = "بث مباشر الآن 🔴";
document.getElementById('currentStatus').style.color = "#ff0055";
startMicBtn.disabled = true;
stopMicBtn.disabled = false;
stopMicBtn.style.background = "#ff0055";
};
stopMicBtn.onclick = function() {
isMicStreaming = false;
document.getElementById('currentStatus').innerText = "إستعداد";
document.getElementById('currentStatus').style.color = "#00ebc7";
startMicBtn.disabled = false;
stopMicBtn.disabled = true;
if (vuMeterBar) vuMeterBar.style.width = "0%";
};
}

// إرسال شات المذيع
if (sendStudioChatBtn && studioChatInput) {
sendStudioChatBtn.onclick = function() {
var text = studioChatInput.value.trim();
if (!text) return;
studioChatInput.value = "";
fetch('/api/messages', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ sender: "المذيع", text: text })
}).then(function() { fetchChatAndStats(); });
};
studioChatInput.addEventListener('keypress', function(e) {
if (e.key === 'Enter') sendStudioChatBtn.click();
});
}

setInterval(fetchChatAndStats, 3000);
fetchChatAndStats();



</script>
</html>
</body>
