<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بث راديو كينج المباشر - استماع وتفاعل</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f0e17; color: #fffffe; padding: 20px; margin: 0; overflow-x: hidden; position: relative; }
        .container { max-width: 600px; margin: 0 auto; padding-top: 20px; position: relative; z-index: 10; }
        h1 { text-align: center; color: #ff0055; font-size: 2rem; margin-bottom: 5px; text-shadow: 0 0 10px rgba(255, 0, 85, 0.3); }
        .sub-title { text-align: center; color: #a7a6ba; font-size: 0.9rem; margin-bottom: 25px; }
        .card { background: #1f1d2e; padding: 25px; border-radius: 12px; border: 1px solid #2a283e; box-shadow: 0 4px 20px rgba(0,0,0,0.4); margin-bottom: 20px; text-align: center; }
        .card h3 { margin-top: 0; color: #ff0055; border-bottom: 2px solid #2a283e; padding-bottom: 10px; font-size: 1.2rem; text-align: right; }
        audio { width: 100%; margin: 15px 0; border-radius: 8px; background: #2a283e; }
        .like-btn { background: #ff0055; color: #fffffe; border: none; padding: 14px; border-radius: 3px; cursor: pointer; font-weight: bold; font-size: 1.1rem; transition: 0.3s; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .like-btn:hover { background: #ff3377; transform: scale(1.02); }
        .chat-messages { height: 200px; overflow-y: auto; background: #0f0e17; border: 1px solid #2a283e; padding: 12px; border-radius: 6px; margin-bottom: 10px; font-size: 14px; text-align: right; }
        .chat-input-row { display: flex; flex-direction: column; gap: 8px; }
        .chat-input { background: #0f0e17; color: #fffffe; border: 1px solid #4a475a; padding: 12px; border-radius: 6px; box-sizing: border-box; width: 100%; }
        .send-btn { background: #00ebc7; color: #0f0e17; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .send-btn:hover { background: #33f0d2; }
        .reaction-bar { display: flex; justify-content: space-around; margin-top: 10px; }
        .reaction-item { font-size: 24px; cursor: pointer; transition: 0.2s; }
        .reaction-item:hover { transform: scale(1.3); }
        
        /* تأثير التفاعلات المتطايرة */
        .floating-emoji { position: fixed; bottom: -50px; font-size: 30px; animation: floatUp 4s linear forwards; pointer-events: none; z-index: 100; }
        @keyframes floatUp {
            0% { bottom: -50px; opacity: 1; transform: translateX(0) scale(0.7); }
            50% { transform: translateX(50px) scale(1.1); }
            100% { bottom: 105vh; opacity: 0; transform: translateX(-50px) scale(1); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📻 راديو كينج بث مباشر</h1>
        <!-- الميزة 2: عداد مستمعين حي في الأعلى -->
        <div class="sub-title">المستمعين المتصلين حالياً: <b id="listenerLiveCount" style="color:#00ebc7">1</b> | استمع وتفاعل مباشرة</div>

        <div class="card">
            <h3>🎵 البث الحي والمباشر</h3>
            <audio id="listenerPlayer" controls autoplay preload="auto"></audio>
        </div>

        <!-- الميزة 3: لوحة التفاعلات المتطايرة بالرموز التعبيرية -->
        <div class="card">
            <h3>🎭 أرسل تفاعل متطاير للشاشة</h3>
            <div class="reaction-bar">
                <span class="reaction-item" onclick="sendReaction('❤️')">❤️</span>
                <span class="reaction-item" onclick="sendReaction('🔥')">🔥</span>
                <span class="reaction-item" onclick="sendReaction('😂')">😂</span>
                <span class="reaction-item" onclick="sendReaction('👍')">👍</span>
                <span class="reaction-item" onclick="sendReaction('🎉')">🎉</span>
            </div>
        </div>

        <div class="card">
            <h3>💬 صندوق دردشة المستمعين</h3>
            <div class="chat-messages" id="listenerChatMessages"></div>
            <div class="chat-input-row">
                <!-- الميزة 1: حقل اسم المستمع التفاعلي الفعلي -->
                <input type="text" id="listenerNameInput" class="chat-input" placeholder="اسمك المستعار..." value="مستمع">
                <input type="text" id="listenerChatInput" class="chat-input" placeholder="اكتب رسالتك للمذيع هنا...">
                <button id="sendListenerChatBtn" class="send-btn">إرسال التعليق</button>
            </div>
        </div>
    </div>

    <script>
        var SERVER_URL = window.location.origin;
        var player = document.getElementById('listenerPlayer');
        var chatMessages = document.getElementById('listenerChatMessages');
        var chatInput = document.getElementById('listenerChatInput');
        var nameInput = document.getElementById('listenerNameInput');
        var sendChatBtn = document.getElementById('sendListenerChatBtn');

        if (player) { player.src = SERVER_URL + "/radio.mp3"; }

        function fetchChatAndStats() {
            // جلب الدردشة
            fetch(SERVER_URL + '/api/messages')
            .then(res => res.json())
            .then(messages => {
                if (!chatMessages) return;
                chatMessages.innerHTML = "";
                messages.forEach(msg => {
                    var div = document.createElement('div');
                    div.style.marginBottom = "8px";
                    var color = msg.sender === "المذيع" ? "#ff0055" : "#00ebc7";
                    div.innerHTML = `<b style="color: ${color}">${msg.sender}:</b> ` + document.createTextNode(msg.text).textContent;
                    chatMessages.appendChild(div);
                });
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }).catch(err => console.log(err));

            // الميزة 2: تحديث عداد المستمعين دورياً
            fetch(SERVER_URL + '/api/listeners-count')
            .then(res => res.json())
            .then(data => {
                var el = document.getElementById('listenerLiveCount');
                if (el && data.count !== undefined) el.innerText = data.count;
            }).catch(err => {});

            // الميزة 3: جلب وعرض التفاعلات المتطايرة من السيرفر لكل شاشات المستمعين
            fetch(SERVER_URL + '/api/reactions')
            .then(res => res.json())
            .then(reactions => {
                if(Array.isArray(reactions)) {
                    reactions.forEach(r => { createFloatingEmoji(r.emoji); });
                }
            }).catch(err => {});
        }

        // الميزة 1: إرسال الاسم والنص الفعلي للسيرفر
        if (sendChatBtn) {
            sendChatBtn.onclick = function(e) {
                if (e) e.preventDefault();
                var text = chatInput.value.trim();
                var sender = nameInput.value.trim() || "مستمع";
                if (!text) return false;
                chatInput.value = "";

                fetch(SERVER_URL + '/api/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sender: sender, text: text })
                })
                .then(() => fetchChatAndStats())
                .catch(err => console.log(err));
                return false;
            };
        }

        // الميزة 3: إرسال تفاعل مخصص ليظهر عند الجميع
        function sendReaction(emoji) {
            fetch(SERVER_URL + '/api/reactions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ emoji: emoji })
            }).catch(err => console.log(err));
        }

        // إنشاء العنصر البصري للتفاعل المتطاير على الشاشة
        function createFloatingEmoji(emoji) {
            var div = document.createElement('div');
            div.className = 'floating-emoji';
            div.innerText = emoji;
            div.style.left = Math.random() * 100 + "vw";
            div.style.animationDuration = (Math.random() * 2 + 3) + "s"; // بين 3 إلى 5 ثواني
            document.body.appendChild(div);
            setTimeout(() => { div.remove(); }, 5000);
        }

        setInterval(fetchChatAndStats, 3000);
        fetchChatAndStats();
    </script>
</body>
</html>
