<!DOCTYPE html> 
<html lang="ar" dir="rtl"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> 
    <title>راديو الملك كينج - البث المباشر</title> 
    <style> 
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f0e17; color: #fffffe; padding: 14px; margin: 0; overflow-x: hidden; -webkit-tap-highlight-color: transparent; } 
        .container { max-width: 450px; margin: 0 auto; padding-top: 10px; } 
        h1 { text-align: center; color: #fffffe; font-size: 1.6rem; margin: 5px 0; font-weight: 800; } 
        .sub-title { text-align: center; color: #00ebc7; font-size: 0.85rem; margin-bottom: 20px; font-weight: 500; } 
        .card { background: #1f1d2e; padding: 18px; border-radius: 14px; border: 1px solid #2a283e; box-shadow: 0 6px 20px rgba(0,0,0,0.5); margin-bottom: 18px; box-sizing: border-box; } 
        
        /* إطار غلاف الألبوم المتغير حركياً */
        .main-cover-wrapper { width: 100%; height: 240px; background: #0f0e17; border-radius: 12px; margin-bottom: 15px; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 1px solid #2a283e; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .main-cover-wrapper img { width: 100%; height: 100%; object-fit: cover; transition: all 0.5s ease; position: relative; z-index: 2; }
        .main-cover-wrapper::before { content: "📻"; position: absolute; font-size: 50px; opacity: 0.15; z-index: 1; }

        .btn-play-stream { background: #ff0055; color: #fffffe; border: none; padding: 14px; border-radius: 25px; cursor: pointer; font-weight: bold; font-size: 1.1rem; transition: all 0.3s; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; box-sizing: border-box; box-shadow: 0 4px 12px rgba(255, 0, 85, 0.3); } 
        .btn-play-stream.playing { background: #00ebc7; color: #0f0e17; box-shadow: 0 4px 12px rgba(0, 235, 199, 0.3); } 
        .btn-like-action { background: transparent; border: 1px solid #ff0055; color: #ff0055; padding: 11px; border-radius: 25px; width: 100%; cursor: pointer; font-size: 13px; font-weight: bold; margin-top: 10px; min-height: 44px; transition: 0.2s; }
        .btn-like-action:active { background: rgba(255, 0, 85, 0.1); }

        .chat-box { height: 180px; overflow-y: auto; background: #0f0e17; border: 1px solid #2a283e; padding: 12px; border-radius: 8px; margin-bottom: 12px; font-size: 13px; text-align: right; line-height: 1.6; } 
        .chat-input-group { display: flex; gap: 8px; } 
        .listener-input { background: #0f0e17; color: #fffffe; border: 1px solid #4a475a; padding: 11px; border-radius: 8px; box-sizing: border-box; flex: 1; font-size: 13px; } 
        .listener-input:focus { border-color: #00ebc7; outline: none; }
        .btn-send-msg { background: #00ebc7; color: #0f0e17; border: none; padding: 0 16px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px; }
        audio { display: none !important; }
    </style> 
</head> 
<body> 
    <div class="container"> 
        <h1>راديو الملك كينج</h1> 
        <div class="sub-title">🎙️ منبر الموسيقى والبودكاست الحي 24H</div> 
        
        <div class="card" style="text-align: center;"> 
            <!-- الغلاف الذكي المصلح برمجياً -->
            <div class="main-cover-wrapper">
                <img id="radioMainCover" src="/image/default-cover.jpg" alt="غلاف البث الحي">
            </div>
            
            <audio id="radioStreamPlayer" preload="none" crossorigin="anonymous"></audio> 
            <button id="playStreamBtn" class="btn-play-stream">▶️ استماع للبث المباشر</button> 
            <button class="btn-like-action" onclick="sendLiveLike()">❤️ أرسل إعجاب للاستوديو الآن</button> 
        </div> 

        <div class="card"> 
            <h3 style="margin-top:0; color:#00ebc7; text-align:center; font-size: 0.95rem;">💬 دردشة الجماهير الحية</h3> 
            <div class="chat-box" id="listenerChatMessages"></div> 
            <div class="chat-input-group"> 
                <input type="text" id="listenerChatInput" class="listener-input" placeholder="اكتب رسالتك للمذيع هنا..."> 
                <button id="sendListenerMsgBtn" class="btn-send-msg">إرسال</button> 
            </div> 
        </div> 
    </div>

    <script>
        var SERVER_URL = window.location.origin; 
        var player = document.getElementById('radioStreamPlayer'); 
        var playBtn = document.getElementById('playStreamBtn'); 
        var chatBox = document.getElementById('listenerChatMessages'); 
        var chatInput = document.getElementById('listenerChatInput'); 
        var sendBtn = document.getElementById('sendListenerMsgBtn'); 
        var isPlaying = false; 

        // 1. التحكم ببدء وإيقاف تيار البث الحي
        playBtn.onclick = function() { 
            if (!isPlaying) { 
                player.src = SERVER_URL + "/radio.mp3?t=" + Date.now(); 
                player.load(); 
                player.play() 
                .then(function() { 
                    isPlaying = true;
                    playBtn.innerText = "⏸️ إيقاف الاستماع"; 
                    playBtn.classList.add('playing');
                }) 
                .catch(function() { 
                    playBtn.innerText = "🔊 جاري الاتصال بالبث..."; 
                }); 
            } else { 
                player.pause(); 
                player.src = ""; // تصفية التخزين المؤقت للبث
                isPlaying = false;
                playBtn.innerText = "▶️ استماع للبث المباشر"; 
                playBtn.classList.remove('playing');
            }
        };

        // 2. الفحص الدوري الذكي لجلب غلاف الألبوم الحالي المحدث من السيرفر
        function fetchLiveCoverAndMeta() {
            fetch(SERVER_URL + '/api/current-album?t=' + Date.now())
            .then(function(res) { return res.json(); })
            .then(function(data) {
                var mainCover = document.getElementById('radioMainCover');
                if (mainCover && data.coverUrl) {
                    // إذا أرسل الفنان رابطاً مكسوراً من Unsplash نقوم بإصلاحه تلقائياً للمستمع
                    if (data.coverUrl.includes("unsplash.com") && !data.coverUrl.includes("://unsplash.com")) {
                        mainCover.src = "https://://unsplash.com/photo-1514525253161-7a46d19cd819?w=500";
                    } else {
                        mainCover.src = data.coverUrl;
                    }
                }
            }).catch(function(){});
        }

        // 3. جلب وتلوين رسائل الدردشة الموحدة
        function fetchLiveChat() {
            fetch(SERVER_URL + '/api/messages?t=' + Date.now())
            .then(function(res) { return res.json(); })
            .then(function(messages) {
                if (!chatBox) return;
                chatBox.innerHTML = "";
                if (Array.isArray(messages)) {
                    messages.forEach(function(msg) {
                        var div = document.createElement('div');
                        div.style.marginBottom = "6px";
                        
                        var color = "#00ebc7"; // المستمع الافتراضي
                        if (msg.sender === "المذيع" || msg.sender.includes("النظام")) color = "#ff0055";
                        if (msg.sender === "الفنان") color = "#ffcc00";

                        div.innerHTML = '<strong style="color:'+color+'">'+msg.sender+':</strong> ' + msg.text;
                        chatBox.appendChild(div);
                    });
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            }).catch(function(){});
        }

        // 4. إرسال تعليقات المستمعين للسيرفر
        function submitMessage() {
            var text = chatInput.value.trim();
            if (!text) return;
            chatInput.value = "";

            fetch(SERVER_URL + '/api/messages', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sender: "مستمع 🎧", text: text })
            })
            .then(function() { fetchLiveChat(); });
        }

        sendBtn.onclick = submitMessage;
        chatInput.onkeypress = function(e) { if (e.key === 'Enter') submitMessage(); };

        // 5. إرسال التفاعلات
        window.sendLiveLike = function() {
            fetch(SERVER_URL + '/api/like', { method: 'POST' })
            .then(function() { alert("تم إرسال حبك ودعمك للاستوديو! ❤️"); });
        };

        // تشغيل التحديث الدوري التلقائي (كل 3 ثوانٍ)
        setInterval(fetchLiveCoverAndMeta, 3000);
        setInterval(fetchLiveChat, 3000);
        fetchLiveCoverAndMeta();
        fetchLiveChat();
    </script>
</body>
</html>
