<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم راديو كينج الذكي</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: #fff; padding: 20px; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; color: #e94560; margin-bottom: 30px; }
        .card { background: #16213e; padding: 20px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #0f3460; }
        .card h3 { margin-top: 0; border-bottom: 2px solid #0f3460; padding-bottom: 8px; }
        button { background: #e94560; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; margin: 5px 0; }
        button:disabled { background: #555; cursor: not-allowed; }
        .status { color: #00f7ff; font-weight: bold; }
        input, select { background: #1a1a2e; color: #fff; border: 1px solid #0f3460; padding: 8px; border-radius: 4px; margin: 5px 0; box-sizing: border-box; }
        input[type="range"] { width: 100%; height: 8px; border-radius: 5px; background: #0f3460; accent-color: #e94560; }
        .flex-group { display: flex; flex-wrap: wrap; gap: 15px; align-items: center; }
        .form-item { display: flex; flex-direction: column; min-width: 150px; }
        .chat-messages { height: 150px; overflow-y: auto; background: #1a1a2e; border: 1px solid #0f3460; padding: 10px; border-radius: 5px; margin-bottom: 10px; }
        .chat-input-row { display: flex; gap: 8px; }
        .chat-input { flex: 1; }
    </style>
  </head>
  <body>

    <div class="container">
      <h1>🎙️ لوحة تحكم البث المباشر (استوديو المذيع)</h1>

      <div class="card">
        <h3>📊 حالة الاستوديو</h3>
        <p>الحالة الحالية: <span id="currentStatus" class="status">إستعداد</span></p>
        <p>الوقت الحالي: <span id="clock">00:00:00</span></p>
      </div>

      <!-- مساحة شات المذيع المضافة لاستقبال والرد على المستمعين -->
      <div class="card">
        <h3>💬 دردشة المستمعين (غرفة تحكم المذيع)</h3>
        <div class="chat-messages" id="studioChatMessages"></div>
        <div class="chat-input-row">
          <input type="text" id="studioChatInput" class="chat-input" placeholder="اكتب ردك للمستمعين هنا...">
          <button id="sendStudioChatBtn">إرسال الرد</button>
        </div>
      </div>

      <div class="card">
        <h3>🎤 البث المباشر عبر الميكروفون</h3>
        <button id="startMicBtn">تشغيل الميكروفون والبث</button>
        <button id="stopMicBtn" disabled>إيقاف البث المباشر</button>
      </div>

      <div class="card">
        <h3>🎛️ وحدة التحكم الصوتي والمؤثرات</h3>
        <div class="form-item">
          <label for="volumeSlider">🔊 مستوى الصوت العام (ألبومات):</label>
          <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="1">
        </div>
        <br>
        <div class="form-item">
          <label for="echoSlider">🌀 مستوى صدى الصوت (الميكروفون):</label>
          <input type="range" id="echoSlider" min="0" max="0.8" step="0.1" value="0">
        </div>
      </div>

      <div class="card">
        <h3>📅 جدولة الألبومات والبودكاست</h3>
        <div class="form-item">
          <label>اختر الملفات الصوتية للألبوم:</label>
          <input type="file" id="albumFiles" multiple accept="audio/*">
        </div>
        <br>
        <div class="flex-group">
          <div class="form-item">
            <label for="schedDay">يوم البث:</label>
            <select id="schedDay">
              <option value="0">الأحد</option>
              <option value="1">الإثنين</option>
              <option value="2">الثلاثاء</option>
              <option value="3">الأربعاء</option>
              <option value="4">الخميس</option>
              <option value="5">الجمعة</option>
              <option value="6">السبت</option>
            </select>
          </div>
          <div class="form-item">
            <label for="schedTime">ساعة البدء:</label>
            <input type="time" id="schedTime">
          </div>
        </div>
        <br>
        <button id="saveSchedBtn">💾 حفظ الجدولة في الذاكرة المحلية</button>
      </div>
    </div>

    <audio id="radioPlayer" preload="auto"></audio>
    <script src="app.js"></script>
  </body>
</html>
