<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة الفنان - البث والدردشة العالمي</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f0c1b; color: #fff; text-align: center; padding: 20px; }
        .profile-card { background: #1a1528; padding: 25px; border-radius: 15px; max-width: 450px; margin: 0 auto 20px auto; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .avatar { width: 110px; height: 110px; border-radius: 50%; border: 3px solid #ff007f; margin-bottom: 15px; }
        .btn-play { background: #ff007f; color: white; border: none; padding: 12px 30px; font-size: 18px; border-radius: 25px; cursor: pointer; transition: 0.3s; }
        .btn-play:hover { transform: scale(1.05); }
        .badge { background: #ff007f; color: #fff; padding: 5px 10px; border-radius: 10px; font-size: 12px; font-weight: bold; }
        .now-playing { font-style: italic; color: #00f2fe; margin-top: 10px; }
        
        .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; text-align: center; margin-top: 15px; }
        .gallery-item { background: #251f38; border-radius: 8px; padding: 10px; border: 1px solid #3c355a; }
        .gallery-img { width: 100%; height: 100px; object-fit: cover; border-radius: 6px; }
        
        .chat-box { text-align: right; }
        .chat-messages { height: 150px; overflow-y: auto; background: #0a0714; border-radius: 8px; padding: 10px; margin-bottom: 10px; border: 1px solid #3c355a; font-size: 14px; }
        .chat-input-row { display: flex; gap: 5px; }
        .chat-input { flex: 1; background: #251f38; border: 1px solid #444; color: white; padding: 8px; border-radius: 5px; }
        .chat-btn { background: #00f2fe; color: black; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
  </head>
  <body>

    <!-- كارت البث الرئيسي -->
    <div class="profile-card">
      <img src="https://picsum.photos" alt="Artist Avatar" class="avatar">
      <h2>إذاعة الفنان المباشرة</h2>
      <p><span class="badge" id="liveBadge">🔴 بث مباشر شغال</span></p>
      <p class="now-playing" id="trackName">راديو كينج بث عالمي مستمر</p>
      <button class="btn-play" id="listenBtn">▶ استماع إلى الراديو</button>
      <audio id="streamPlayer"></audio>
    </div>

    <!-- معرض صور الألبومات والبودكاست المرئي -->
    <div class="profile-card">
      <h3>🎵 معرض ألبومات الفنان المرئي</h3>
      <div class="gallery">
        <div class="gallery-item">
          <img src="https://picsum.photos" class="gallery-img">
          <p style="font-size:13px; margin:5px 0 0 0;">بودكاست خواطر</p>
        </div>
        <div class="gallery-item">
          <img src="https://picsum.photos" class="gallery-img">
          <p style="font-size:13px; margin:5px 0 0 0;">ألبوم الموسيقى الهادئة</p>
        </div>
      </div>
    </div>

    <!-- مساحة الدردشة الحية وتلقي الرسائل -->
    <div class="profile-card chat-box">
      <h3>💬 دردشة المستمعين الحية</h3>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-row">
        <input type="text" id="chatInput" class="chat-input" placeholder="اكتب رسالتك للمذيع هنا...">
        <button id="sendChatBtn" class="chat-btn">إرسال</button>
      </div>
    </div>

    <script>
        var player = document.getElementById('streamPlayer');
        var listenBtn = document.getElementById('listenBtn');
        var liveBadge = document.getElementById('liveBadge');
        var trackName = document.getElementById('trackName');
        var chatMessages = document.getElementById('chatMessages');
        var chatInput = document.getElementById('chatInput');
        var sendChatBtn = document.getElementById('sendChatBtn');

        // رابط سيرفر الصوت الخاص بك على منصة Render
        var RENDER_STREAM_URL = "https://onrender.com";

        // استقبال الرسائل القادمة من المذيع وتحديث الشات
        window.addEventListener('storage', function(e) {
            if (e.key === 'chat_sync_msg' && e.newValue) {
                var msgData = e.newValue.split('||')[0];
                appendMessage("المذيع", msgData);
            }
        });

        // تشغيل وإيقاف البث الحي القادم من سيرفر Render
        listenBtn.addEventListener('click', function() {
            if (player.paused) {
                player.src = RENDER_STREAM_URL;
                player.play().then(function() {
                    listenBtn.innerText = "⏸ إيقاف مؤقت";
                }).catch(function(err) {
                    alert("تعذر الاتصال بالبث المباشر. يرجى التأكد من تشغيل السيرفر بالكامل.");
                    console.log("Error playing stream:", err);
                });
            } else {
                player.pause();
                player.src = ""; // تفريغ الذاكرة من التدفق المستمر عند الإيقاف
                listenBtn.innerText = "▶ استماع إلى الراديو";
            }
        });

        // إرسال رسائل المستمع إلى المذيع
        sendChatBtn.addEventListener('click', function() {
            var text = chatInput.value.trim();
            if(!text) return;
            appendMessage("مستمع", text);
            localStorage.setItem('chat_listener_msg', text + "||" + Date.now());
            chatInput.value = "";
        });

        function appendMessage(sender, msg) {
            var div = document.createElement('div');
            div.innerHTML = "<b>" + sender + ":</b> " + msg;
            div.style.marginBottom = "5px";
            if (sender === "المذيع") div.style.color = "#00f2fe";
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    </script>
  </body>
</html>
